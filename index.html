<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1d2b3a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  canvas {
    background: #70c5ce;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    aspect-ratio: 400 / 600;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Tunables
  const GRAVITY = 0.45;
  const FLAP_VELOCITY = -8;
  const MAX_FALL = 10;
  const PIPE_WIDTH = 60;
  const PIPE_GAP = 150;
  const PIPE_SPEED = 2.4;
  const PIPE_INTERVAL = 1500; // ms between pipe spawns
  const GROUND_H = 80;
  const BIRD_X = 90;
  const BIRD_R = 16;

  const PIPE_BODY = '#73bf2e';
  const PIPE_EDGE = '#3e7a14';
  const PIPE_HIGHLIGHT = '#a4e05a';

  const state = {
    mode: 'ready', // 'ready' | 'playing' | 'over'
    bird: { y: H / 2, vy: 0, rotation: 0 },
    pipes: [],
    score: 0,
    lastSpawn: 0,
    clouds: Array.from({ length: 4 }, (_, i) => ({
      x: (i * 137) % W,
      y: 60 + ((i * 53) % 200),
      s: 0.6 + ((i * 0.37) % 0.8),
    })),
    time: 0,
  };

  let best = Number(localStorage.getItem('flappy-best') || 0);

  function reset() {
    state.mode = 'ready';
    state.bird = { y: H / 2, vy: 0, rotation: 0 };
    state.pipes = [];
    state.score = 0;
    state.lastSpawn = 0;
  }

  function flap() {
    if (state.mode === 'ready') {
      state.mode = 'playing';
      state.lastSpawn = performance.now() - PIPE_INTERVAL; // spawn first pipe right away
    }
    if (state.mode === 'playing') {
      state.bird.vy = FLAP_VELOCITY;
    } else if (state.mode === 'over') {
      reset();
      state.mode = 'ready';
    }
  }

  // Input
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!e.repeat) flap();
    }
  });
  canvas.addEventListener('mousedown', flap);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });

  function spawnPipe() {
    const margin = 60;
    const minTop = margin;
    const maxTop = H - GROUND_H - PIPE_GAP - margin;
    const gapTop = minTop + Math.random() * (maxTop - minTop);
    state.pipes.push({ x: W + PIPE_WIDTH, gapTop, passed: false });
  }

  function update(dt, now) {
    state.time += dt;

    // Clouds drift even on the title screen
    for (const c of state.clouds) {
      c.x -= 0.4 * c.s * (dt / 16.67);
      if (c.x < -80) { c.x = W + 40; c.y = 40 + Math.random() * 200; }
    }

    if (state.mode === 'ready') {
      // Gentle bob
      state.bird.y = H / 2 + Math.sin(state.time / 300) * 8;
      return;
    }

    if (state.mode === 'over') {
      // Keep the bird falling to the ground after a game over
      updateBird(dt, true);
      return;
    }

    // Playing
    const step = dt / 16.67;
    if (now - state.lastSpawn > PIPE_INTERVAL) {
      spawnPipe();
      state.lastSpawn = now;
    }

    for (const p of state.pipes) {
      p.x -= PIPE_SPEED * 1.2 ** state.score * step;
    }

    updateBird(dt, false);

    // Scoring
    for (const p of state.pipes) {
      if (!p.passed && p.x + PIPE_WIDTH < BIRD_X - BIRD_R) {
        p.passed = true;
        state.score++;
      }
    }
    state.pipes = state.pipes.filter((p) => p.x + PIPE_WIDTH > -10);

    // Pipes and ground end the run
    if (hitsPipe()) {
      endGame();
    }
    if (state.bird.y + BIRD_R >= H - GROUND_H) {
      state.bird.y = H - GROUND_H - BIRD_R;
      endGame();
    }
  }

  // Circle (bird) vs. the two rectangles of each pipe (top and bottom).
  // Pipe caps are 5px wider than the body on each side, so use the cap width.
  function hitsPipe() {
    const b = state.bird;
    for (const p of state.pipes) {
      const left = p.x - 5;
      const right = p.x + PIPE_WIDTH + 5;
      const rects = [
        { top: 0, bottom: p.gapTop },
        { top: p.gapTop + PIPE_GAP, bottom: H - GROUND_H },
      ];
      for (const r of rects) {
        const nx = Math.max(left, Math.min(BIRD_X, right));
        const ny = Math.max(r.top, Math.min(b.y, r.bottom));
        const dx = BIRD_X - nx;
        const dy = b.y - ny;
        if (dx * dx + dy * dy < BIRD_R * BIRD_R) return true;
      }
    }
    return false;
  }

  function updateBird(dt, falling) {
    const step = dt / 16.67;
    const b = state.bird;
    if (!falling || b.y < H - GROUND_H - BIRD_R) {
      b.vy = Math.min(b.vy + GRAVITY * step, MAX_FALL);
      b.y += b.vy * step;
    }
    // Ceiling clamp
    if (b.y - BIRD_R < 0) {
      b.y = BIRD_R;
      b.vy = 0;
    }
    // Tilt toward velocity
    const target = b.vy < 0 ? -0.45 : Math.min(Math.PI / 2, b.vy * 0.12);
    b.rotation += (target - b.rotation) * 0.15 * step;
  }

  function endGame() {
    if (state.mode === 'over') return;
    state.mode = 'over';
    state.bird.vy = 0;
    if (state.score > best) {
      best = state.score;
      localStorage.setItem('flappy-best', String(best));
    }
  }

  // ---------- Drawing ----------
  // ---------- 8-bit autumn background ----------
  const PX = 4; // size of one "8-bit" pixel
  const FLOOR = H - GROUND_H;
  const snap = (v) => Math.floor(v / PX) * PX;
  const SKY = ['#3f6f9f', '#5a86a8', '#7f9aa8', '#a8a595', '#d0a97f', '#e8a860', '#f0bc6c', '#f6d08a'];
  const FOLIAGE = [
    { l: '#e8693a', c: '#c8401f', d: '#8f2a18' }, // red
    { l: '#f4a43a', c: '#e07b1a', d: '#a8530f' }, // orange
    { l: '#f8d858', c: '#e8b020', d: '#b07e12' }, // gold
    { l: '#c8503c', c: '#a82e24', d: '#701c18' }, // maroon
  ];
  const LEAVES = ['#c8401f', '#e07b1a', '#e8b020', '#a82e24'];
  const TREE = [
    '...lllc....',
    '.lllccccc..',
    'llcccccccd.',
    'lcccccccccd',
    'lcccdcccccd',
    'ccccccccddd',
    'ccdcccccccd',
    '.cccccdccd.',
    '..ccccccdd.',
    '...ddtdd...',
    '.....t.....',
    '.....t.....',
    '....ttt....',
  ];
  const TREE_GAP = 64;

  const farHill = (col) => snap(380 + Math.sin(col * 0.17) * 28 + Math.sin(col * 0.05) * 30);
  const nearHill = (col) => snap(450 + Math.sin(col * 0.11 + 2) * 20 + Math.sin(col * 0.29) * 8);

  // The sky never changes, so paint it (dithered bands and a blocky sun) once.
  const sky = document.createElement('canvas');
  sky.width = W;
  sky.height = FLOOR;
  {
    const g = sky.getContext('2d');
    const bandH = FLOOR / SKY.length;
    for (let y = 0; y < FLOOR; y += PX) {
      for (let x = 0; x < W; x += PX) {
        const band = Math.floor(y / bandH);
        const nearEdge = (band + 1) * bandH - y <= PX * 2;
        const checker = (x + y) / PX % 2 === 0;
        g.fillStyle = SKY[Math.min(band + (nearEdge && checker ? 1 : 0), SKY.length - 1)];
        const dist = Math.hypot(x - 304, y - 176);
        if (dist < 28) g.fillStyle = '#fff0b0';
        else if (dist < 36) g.fillStyle = '#ffd870';
        g.fillRect(x, y, PX, PX);
      }
    }
  }

  function drawHills(color, speed, topAt) {
    const scroll = snap(state.time * speed);
    ctx.fillStyle = color;
    for (let x = -(scroll % 8); x < W; x += 8) {
      const y = topAt(Math.floor((x + scroll) / 8));
      ctx.fillRect(x, y, 8, FLOOR - y);
    }
  }

  function drawTrees(speed) {
    const scroll = snap(state.time * speed);
    const first = Math.floor((scroll - TREE_GAP) / TREE_GAP);
    for (let i = first; i * TREE_GAP - scroll < W; i++) {
      const n = Math.abs(i);
      const wx = i * TREE_GAP + (n * 37) % 24;
      const colors = { ...FOLIAGE[n % FOLIAGE.length], t: '#4a2c18' };
      const left = snap(wx) - scroll;
      const top = nearHill(Math.floor(wx / 8)) + PX - TREE.length * PX;
      TREE.forEach((row, ry) => {
        for (let rx = 0; rx < row.length; rx++) {
          if (row[rx] === '.') continue;
          ctx.fillStyle = colors[row[rx]];
          ctx.fillRect(left + rx * PX, top + ry * PX, PX, PX);
        }
      });
    }
  }

  function drawLeaves() {
    const t = state.time;
    for (let i = 0; i < 16; i++) {
      const x = W + 20 - (t * (0.03 + (i % 4) * 0.012) + i * 83) % (W + 40);
      const y = (t * (0.035 + (i % 3) * 0.012) + i * 131) % FLOOR;
      const flip = Math.floor(t / 250 + i) % 2 === 1;
      ctx.fillStyle = LEAVES[i % LEAVES.length];
      ctx.fillRect(snap(x + Math.sin(t / 500 + i) * 10), snap(y), flip ? PX * 2 : PX, flip ? PX : PX * 2);
    }
  }

  function drawBackground() {
    ctx.drawImage(sky, 0, 0);

    // Clouds
    ctx.fillStyle = '#f6e6cf';
    for (const c of state.clouds) {
      const x = snap(c.x);
      const y = snap(c.y);
      const w = snap(50 * c.s);
      ctx.fillRect(x + snap(w / 4), y, snap(w / 2), PX * 2);
      ctx.fillRect(x, y + PX * 2, w, PX * 3);
    }

    drawHills('#8a5a68', 0.008, farHill);
    drawTrees(0.02);
    drawHills('#6e3a22', 0.02, nearHill);
    drawLeaves();
  }

  function drawPipe(x, y, w, h, capAtTop) {
    if (h <= 0) return;
    ctx.fillStyle = PIPE_BODY;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = PIPE_HIGHLIGHT;
    ctx.fillRect(x + 6, y, 6, h);
    ctx.strokeStyle = PIPE_EDGE;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    // Cap
    const capH = 24;
    const capY = capAtTop ? y + h - capH : y;
    ctx.fillStyle = PIPE_BODY;
    ctx.fillRect(x - 5, capY, w + 10, capH);
    ctx.fillStyle = PIPE_HIGHLIGHT;
    ctx.fillRect(x - 5 + 6, capY, 6, capH);
    ctx.strokeRect(x - 5, capY, w + 10, capH);
  }

  function drawPipes() {
    for (const p of state.pipes) {
      drawPipe(p.x, 0, PIPE_WIDTH, p.gapTop, true);
      drawPipe(p.x, p.gapTop + PIPE_GAP, PIPE_WIDTH, H - GROUND_H - (p.gapTop + PIPE_GAP), false);
    }
  }

  function drawGround() {
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(0, H - GROUND_H, W, 14);
    ctx.fillStyle = '#5a9a22';
    const offset = (state.time / 20) % 24;
    for (let x = -offset; x < W; x += 24) {
      ctx.fillRect(x, H - GROUND_H + 14, 12, 4);
    }
  }

  function drawBird() {
    const b = state.bird;
    ctx.save();
    ctx.translate(BIRD_X, b.y);
    ctx.rotate(b.rotation);

    // Body
    ctx.fillStyle = '#f7d038';
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8a6d12';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Wing
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath();
    ctx.ellipse(-4, 4, 8, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(8, -5, 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#f08a24';
    ctx.beginPath();
    ctx.moveTo(10, 2);
    ctx.lineTo(22, 6);
    ctx.lineTo(10, 10);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawText(text, x, y, size, color = '#fff', stroke = true) {
    ctx.font = `bold ${size}px Arial, Helvetica, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (stroke) {
      ctx.lineWidth = Math.max(4, size / 6);
      ctx.strokeStyle = '#3a2a00';
      ctx.strokeText(text, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function drawHUD() {
    if (state.mode !== 'ready') {
      drawText(String(state.score), W / 2, 70, 56);
    }
  }

  function drawReady() {
    drawText('Flappy Bird', W / 2, 160, 44, '#ffd84a');
    drawText('Tap, click, or press Space', W / 2, H / 2 + 80, 18, '#ffffff');
    drawText('to flap', W / 2, H / 2 + 104, 18, '#ffffff');
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
    drawText('Game Over', W / 2, H / 2 - 90, 44, '#ff6b6b');
    drawText(`Score: ${state.score}`, W / 2, H / 2 - 30, 26);
    drawText(`Best: ${best}`, W / 2, H / 2 + 5, 22);
    drawText('Tap or press Space to restart', W / 2, H / 2 + 90, 16);
  }

  function draw() {
    drawBackground();
    drawPipes();
    drawGround();
    drawBird();
    drawHUD();
    if (state.mode === 'ready') drawReady();
    if (state.mode === 'over') drawGameOver();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last);
    last = now;
    update(dt, now);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
